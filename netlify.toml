# Netlify — build static Astro. NU se publică fără confirmarea proprietarului.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Securitate de bază (fără a bloca fonturile self-hosted sau Netlify Forms)
#
# CONTENT-SECURITY-POLICY. Ce apără, cinstit spus:
#   • `connect-src 'self'` — chiar dacă un cod străin ar ajunge să ruleze în pagină, NU
#     poate trimite nimic în afară. Asta e apărarea care contează pentru un registru cu
#     date personale: scurgerea, nu execuția.
#   • `form-action 'self'` — un formular nu poate fi deturnat către alt server.
#   • `base-uri 'self'` + `object-src 'none'` — închid două căi clasice de deturnare.
#   • `script-src 'self'` — nu se poate încărca cod de pe alt domeniu.
#
# Ce NU apără: `'unsafe-inline'` la scripturi. Site-ul e static, cu zeci de blocuri
# `is:inline`, iar nonce-urile cer un server care rescrie fiecare pagină. Așa că un cod
# injectat DIRECT în pagină tot ar rula — dar n-ar avea unde să trimită ce fură.
# Alternativa (nonce peste tot) e o lucrare separată, nu o linie de configurare.
#
# `'wasm-unsafe-eval'` e pentru Pagefind (căutarea internă rulează pe WebAssembly);
# fără el, căutarea moare în tăcere. Verificat: cu politica asta, căutarea întoarce
# rezultate, formularul Google se încarcă, iar aplicația de rase funcționează.
#
# `blob:` la imagini e pentru previzualizarea pozelor în formularul DMF și pentru
# manualul de studiu; `data:` e pentru codurile QR generate pe server.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src 'self' https://docs.google.com"

# Pagina veche „în curând" e singura care mai încarcă fonturi de la Google. Nu merită
# rescrisă, dar nici nu are rost să slăbim politica întregului site pentru ea: primește
# una proprie, cu exact atât cât îi trebuie.
[[headers]]
  for = "/in-curand/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'"

# Fonturile self-hosted — cache lung (sunt imuabile, versionate prin nume)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CFCR Breed Standards Explorer (PWA statică în /breed-explorer/). Service worker-ul și
# manifestul NU se cache-uiesc, ca actualizările aplicației să ajungă imediat la useri
# (Netlify servește deja .webmanifest ca application/manifest+json; .htaccess-ul inclus e
# doar pentru găzduiri Apache și e inert aici).
# Aplicația e disponibilă doar candidaților de arbitru: linkul activ e DOAR în platforma
# Școlii de Arbitraj (/cursuri/, protejată cu cod), iar pe pagina publică a Centrului cardul
# apare inactiv (informativ). Deci NU o indexăm în motoarele de căutare. Excluderea din
# căutarea internă (Pagefind) se face cu data-pagefind-ignore pe paginile aplicației.
[[headers]]
  for = "/breed-explorer/*"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/breed-explorer/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/breed-explorer/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"
# Suporturile de curs ale lectorilor: nu trebuie găsite prin căutare (sunt materiale
# de studiu, nu conținut public). Le scoatem din index; accesul rămâne pe link partajat.
[[headers]]
  for = "/cursuri-materiale/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Rădăcina (apex cfc-royal.ro) SERVEȘTE direct conținutul homepage-ului RO (rewrite 200, NU redirect).
# Motiv: linkul scurt cfc-royal.ro trebuie să afișeze cardul social (WhatsApp/Facebook). Un redirect
# (302 la edge sau meta-refresh) făcea roboții să nu genereze cardul. Cu rewrite, apex-ul returnează
# exact pagina /ro/ — cea care funcționează deja — cu tot cu Open Graph. URL-ul rămâne cfc-royal.ro;
# navigarea ulterioară intră firesc în /ro/ sau /en/.
[[redirects]]
  from = "/"
  to = "/ro/"
  status = 200
  force = true

# Adresa STABILĂ a managerului de expoziții: /r/<cale> ajunge la tunelul curent al
# managerului (funcția tunel decide unde), ca QR-urile tipărite să nu moară niciodată.
# Ex.: cfc-royal.ro/r/ring/<id>, cfc-royal.ro/r/panou/<id>, cfc-royal.ro/r/ring-onoare/<id>
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/tunel?tinta=:splat"
  status = 200
  force = true

# Linkul veșnic al panoului live: /live → panoul expoziției curente (funcția tunel știe care).
[[redirects]]
  from = "/live"
  to = "/.netlify/functions/tunel?tinta=live"
  status = 200
  force = true

# Rezultatele publicate ale expozițiilor (doar titlurile): pagina unei ediții + indexul.
[[redirects]]
  from = "/rezultate-live/*"
  to = "/.netlify/functions/rezultate-expo"
  status = 200
  force = true

[[redirects]]
  from = "/rezultate-live"
  to = "/.netlify/functions/rezultate-expo"
  status = 200
  force = true

# Redenumire pagină: Școala de Arbitraj → Centrul de Dezvoltare a Competențelor Chinologice
[[redirects]]
  from = "/ro/educatie/scoala-arbitraj/"
  to = "/ro/educatie/centrul-competentelor-chinologice/"
  status = 301
  force = true

[[redirects]]
  from = "/en/educatie/scoala-arbitraj/"
  to = "/en/educatie/centrul-competentelor-chinologice/"
  status = 301
  force = true

# Redenumire secțiune: Afiliați → Asociații membre (slug /afiliati/ → /membrii/)
[[redirects]]
  from = "/ro/afiliati/*"
  to = "/ro/membrii/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/afiliati/*"
  to = "/en/membrii/:splat"
  status = 301
  force = true

# Manualul de studiu individual: paginile NU se publică (nu sunt în `dist/`), ci se
# includ în pachetul funcției care le servește. Așa nu există nicio adresă publică
# spre ele — se ajunge la o pagină doar prin `material-protejat`, după verificarea rolului.
# `sharp` rămâne extern: e un modul nativ, nu se poate împacheta cu esbuild.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[functions."material-protejat"]
  included_files = ["material-studiu/**"]
