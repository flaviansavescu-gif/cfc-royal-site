# =========================================================================
# paznic.yml — paznicul de disponibilitate al ecosistemului CFC-Royal.
#
# DE CE. Toate apărările din cod presupun că site-ul RĂSPUNDE. Dacă Netlify cade,
# dacă domeniul expiră sau dacă o funcție moare, nimeni nu afla — până se plângea
# un om, poate în dimineața unei expoziții. Paznicul rulează pe serverele GitHub
# (în afara Netlify, deci vede și căderile Netlify) și încearcă, din 10 în 10
# minute, ușile care contează.
#
# ALARMA. Fără chei, fără servicii noi: când o verificare cade, rularea EȘUEAZĂ,
# iar GitHub trimite singur e-mail proprietarului depozitului — mecanismul lui
# standard pentru atelierele picate. Cât timp totul e verde, tăcere deplină.
#
# Fiecare încercare are 3 reluări cu pauză: o sughițare de rețea de o secundă nu
# trebuie să sune alarma. Programarea GitHub are un joc de câteva minute — nu e
# ceas elvețian, e paznic de noapte.
# =========================================================================
name: Paznic de disponibilitate

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Least privilege: paznicul doar face curl; nu are ce scrie in depozit.
permissions:
  contents: read

jobs:
  paznic:
    name: "PAZNIC — cfc-royal.ro raspunde?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pagina principala
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 20 "https://cfc-royal.ro/ro/" | grep -q "Chinologic" \
            || { echo "::error::Pagina principala nu raspunde sau nu are continutul asteptat."; exit 1; }

      - name: Formularul de inscriere la expozitii
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 20 "https://cfc-royal.ro/ro/inscriere-expozitie/" >/dev/null \
            || { echo "::error::Pagina de inscriere la expozitii nu raspunde."; exit 1; }

      - name: Cartea de origini (pagina publica)
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 20 "https://cfc-royal.ro/caine/" >/dev/null \
            || { echo "::error::Cartea de origini nu raspunde."; exit 1; }

      - name: Functiile de server (stare-cursuri, GET public)
        run: |
          raspuns=$(curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 20 "https://cfc-royal.ro/.netlify/functions/stare-cursuri") \
            || { echo "::error::Functiile de server nu raspund deloc."; exit 1; }
          echo "$raspuns" | grep -q "_termene" \
            || { echo "::error::Functia stare-cursuri a raspuns, dar nu cu forma asteptata."; exit 1; }

      - name: Scoala de Arbitraj (poarta platformei)
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 20 "https://cfc-royal.ro/cursuri/" >/dev/null \
            || { echo "::error::Pagina Scolii de Arbitraj nu raspunde."; exit 1; }

      # PAZNICUL PAZNICILOR. Functiile programate (monitorul, paznicul de intruziune,
      # copiile saptamanale) pot inceta sa ruleze IN TACERE — iar lipsa de alarme arata
      # exact ca sanatatea. Fereastra publica stare-inimi spune cand a batut ultima data
      # inima fiecareia si daca posta (Brevo) mai poate trimite; `ok:false` inseamna ca
      # o functie care mergea s-a oprit, sau ca alarmele insesi au ramas fara canal —
      # si atunci suna ACEST paznic, care nu depinde nici de Netlify Scheduler, nici de
      # Brevo. Detaliul din raspuns se afiseaza in jurnalul rularii, ca e-mailul de la
      # GitHub sa duca direct la cauza.
      - name: Inimile functiilor programate + posta (stare-inimi)
        run: |
          raspuns=$(curl --silent --show-error --fail --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 20 "https://cfc-royal.ro/.netlify/functions/stare-inimi") \
            || { echo "::error::Fereastra stare-inimi nu raspunde."; exit 1; }
          # `.ok` de NIVEL SUPERIOR, citit cu jq — NU grep pe substring. Raspunsul are si
          # `posta.ok`, iar un grep neancorat gasea `"ok":true` din posta si trecea verde
          # chiar cand o inima murise (top-level ok:false). jq e preinstalat pe ubuntu-latest.
          echo "$raspuns" | jq -e '.ok == true' >/dev/null \
            || { echo "::error::O functie programata a tacut peste prag sau posta (Brevo) nu mai poate trimite:"; echo "$raspuns"; exit 1; }

      # CHECK-IN RECIPROC. GitHub vegheaza Netlify+inimile; ca sa fie vegheat SI el, isi bate
      # o urma pe Netlify la fiecare rulare. Daca acest workflow e dezactivat/sters, urma se
      # invecheste si monitor-flux (Netlify+Brevo, independent de GitHub) suna. Best-effort:
      # daca Netlify e jos, verificarile de mai sus au sunat deja, deci nu dublam alarma.
      - name: Check-in reciproc (paznicul din Actions e viu)
        if: always()
        run: |
          curl --silent --max-time 15 "https://cfc-royal.ro/.netlify/functions/paznic-extern" >/dev/null || true
